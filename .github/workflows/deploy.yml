name: Deploy

# One click: Actions tab, "Deploy", "Run workflow".
# Also runs on every push to main.
on:
  workflow_dispatch:
    inputs:
      run_ingest:
        description: "Refresh market data after deploying"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/**"
      - "web/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: eu-west-1
  PROJECT: gapo
  TF_IN_AUTOMATION: "true"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The PyTorch image is ~1.5 GB. Default runners run out of space
        # during the build if you skip this.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.PROJECT }}-tfstate-lock"

      # --------------------------------------------------------------
      # Ordering problem: Lambda cannot be created from an image that
      # does not exist, and the image cannot be pushed to a repository
      # that does not exist. Create the repository first, then build,
      # then apply the rest. This is why the workflow is not a single
      # terraform apply.
      # --------------------------------------------------------------
      - name: Create registry
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.app \
            -var="image_tag=bootstrap"

      - name: Registry login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch model checkpoint
        # The checkpoint lives in the artifact bucket, not in git. A .pth
        # file in version control bloats every clone forever and you will
        # eventually commit a 400 MB one by accident.
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          mkdir -p app/artifacts
          aws s3 cp \
            "s3://${PROJECT}-artifacts-${ACCOUNT}/models/full_model.pth" \
            app/artifacts/full_model.pth
          sha256sum app/artifacts/full_model.pth | awk '{print $1}' > app/artifacts/model.sha256
          echo "Checkpoint sha256: $(cat app/artifacts/model.sha256)"

      - name: Build and push image
        working-directory: app
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${{ env.PROJECT }}:${{ github.sha }}"
          docker build --provenance=false -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Pushed $IMAGE"

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -var="image_tag=${{ github.sha }}" -out=tfplan

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan

      - name: Read outputs
        id: tf
        working-directory: infra
        run: |
          {
            echo "site_url=$(terraform output -raw site_url)"
            echo "web_bucket=$(terraform output -raw web_bucket)"
            echo "distribution_id=$(terraform output -raw distribution_id)"
            echo "ingest_function=$(terraform output -raw ingest_function)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish web assets
        run: |
          aws s3 sync web/ "s3://${{ steps.tf.outputs.web_bucket }}/" \
            --delete --cache-control "public,max-age=300"
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution_id }}" \
            --paths "/*" >/dev/null

      - name: Refresh market data
        if: github.event_name == 'push' || inputs.run_ingest
        run: |
          aws lambda invoke \
            --function-name "${{ steps.tf.outputs.ingest_function }}" \
            --cli-read-timeout 660 \
            --payload '{}' \
            /tmp/ingest.json
          cat /tmp/ingest.json

      - name: Smoke test
        run: |
          URL="${{ steps.tf.outputs.site_url }}/api/"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST "$URL" \
              -H 'content-type: application/json' \
              -d '{"tickers":["AAPL","MSFT","NVDA","JPM","XOM","PG","COST","HD","V","KO"]}') || true
            echo "attempt $i -> $CODE"
            [ "$CODE" = "200" ] && cat /tmp/out.json && exit 0
            sleep 20
          done
          echo "Smoke test failed. Last response:"; cat /tmp/out.json; exit 1

      - name: Summary
        if: always()
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tf.outputs.site_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image tag: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
